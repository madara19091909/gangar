
name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inspect files before generation
        run: |
          echo "=== Test files before flutter create ==="
          find test -maxdepth 3 -type f -print 2>/dev/null || true

          echo "=== Git tracked test files ==="
          git ls-files test

          echo "=== Project name ==="
          grep -n "^name:" pubspec.yaml || true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Remove incompatible default widget test
        run: |
          if [ -f test/widget_test.dart ]; then
            echo "Removing incompatible default widget test"
            rm test/widget_test.dart
          fi
      
      - name: Inspect files after generation
        run: |
          echo "=== Test files after flutter create ==="
          find test -maxdepth 3 -type f -print 2>/dev/null || true

          echo "=== Search for MyApp references ==="
          grep -RIn "MyApp" test lib || true

          echo "=== Main entry point ==="
          sed -n '1,160p' lib/main.dart

          echo "=== Android project files ==="
          ls -la android
          ls -la android/app

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-tools-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
