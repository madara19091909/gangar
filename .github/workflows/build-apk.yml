
name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Inspect test files
        run: |
          echo "=== Test files before analysis ==="
          find test -maxdepth 3 -type f -print
          echo "=== Search for MyApp references ==="
          grep -RIn "MyApp" test lib || true
      
      - name: Verify Android project
        run: |
          ls -la android
          ls -la android/app

      - name: Install dependencies
        run: flutter pub get

      - name: Debug project files
        run: |
          echo "=== Test files ==="
          find test -maxdepth 3 -type f 2>/dev/null || true
          echo "=== Main app ==="
          sed -n '1,120p' lib/main.dart
          echo "=== Git status ==="
          git status --short

      - name: Analyze
        run: flutter analyze
        
      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-tools-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
